name: Preparar versao para a Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preparar-hostinger
  cancel-in-progress: true

jobs:
  build-static-site:
    name: Compilar versao estatica
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar codigo do sistema
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar o sistema
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Publicar versao compilada na ramificacao da Hostinger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          rm -rf hostinger-build
          mkdir hostinger-build
          cp -R dist/. hostinger-build/
          cd hostinger-build
          git init
          git checkout -b hostinger-deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Versao compilada ${COMMIT_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git"
          git push --force origin hostinger-deploy
