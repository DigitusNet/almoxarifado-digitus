name: Publicar na Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hostinger-producao
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Compilar e publicar o sistema
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar a versao atual do sistema
        uses: actions/checkout@v6

      - name: Preparar o Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar o site
        run: npm run build

      - name: Enviar para a Hostinger por SFTP
        uses: wangyucode/sftp-upload-action@v3
        with:
          host: ${{ secrets.HOSTINGER_FTP_HOST }}
          port: 65002
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          localDir: ./dist
          remoteDir: public_html
          forceUpload: true
          removeExtraFilesOnServer: false
          concurrency: 2
