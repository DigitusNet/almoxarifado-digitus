name: Publicar na Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hostinger-producao
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Compilar e publicar o sistema
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar a versao atual do sistema
        uses: actions/checkout@v6

      - name: Preparar o Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar o site
        run: npm run build

      - name: Instalar cliente SFTP
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Enviar para a Hostinger por SFTP
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          lftp <<EOF
          set cmd:fail-exit yes
          set net:timeout 30
          set net:max-retries 2
          set sftp:auto-confirm yes
          open -p 65002 -u "$HOSTINGER_USERNAME","$HOSTINGER_PASSWORD" sftp://$HOSTINGER_HOST
          cd public_html
          mirror --reverse --verbose=1 --ignore-time --no-perms ./dist .
          bye
          EOF
